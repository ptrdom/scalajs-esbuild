name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        jdk: [8, 25]
        os: [ubuntu-22.04, windows-2025]
        browser: ["${{ vars.E2E_TEST_BROWSER }}"]
        experimental: [false]
        test-suffix: [release, snapshot]
        include:
          - jdk: 25
            os: macos-14
            browser: chrome
            experimental: true
            test-suffix: release
          - jdk: 25
            os: macos-14
            browser: chrome
            experimental: true
            test-suffix: snapshot
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      SBT_CHECK_TASKS: scalafmtSbtCheck scalafmtCheckAll e2e-testkit/scalafmtCheckAll e2e-web/scalafmtCheckAll e2e-electron/scalafmtCheckAll test
      SBT_SCRIPTED_TARGETS: ${{ matrix.jdk == 8 && format('sbt-scalajs-esbuild/*-{0} sbt-scalajs-esbuild-electron/basic-project-{0} sbt-scalajs-esbuild-electron/e2e-test-playwright-node-{0} sbt-scalajs-esbuild-electron/electron-builder-{0} sbt-scalajs-esbuild-electron/electron-forge-{0}', matrix.test-suffix) || format('*/*-{0}', matrix.test-suffix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v8
        id: coursier-cache
      - uses: coursier/setup-action@v3
        with:
          jvm: temurin:${{ matrix.jdk }}
          # Pin to the sbt 1.x runner: the latest runner is sbt 2.x, which
          # requires JDK 17+ (breaking the JDK 8 matrix) and parses CLI
          # commands differently. Kept in sync with sbt releases by Renovate.
          apps: sbt:1.12.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
      - name: Enable Corepack
        run: corepack enable
      - name: Prime corepack package managers (Windows)
        if: startsWith(matrix.os, 'windows-')
        shell: bash
        run: |
          corepack prepare pnpm@11.17.0
          corepack prepare yarn@1.22.22
          corepack prepare yarn@4.17.1
      - name: Cache Selenium Manager browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/selenium
          key: selenium-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('**/sbt-test/**/html.sbt', 'e2e/**/E2ESupport.scala') }}
          restore-keys: |
            selenium-${{ runner.os }}-${{ matrix.browser }}-
      - name: Run tests (Linux/macOS)
        if: ${{ !startsWith(matrix.os, 'windows-') }}
        uses: coactions/setup-xvfb@v1
        env:
          E2E_TEST_BROWSER: ${{ matrix.browser }}
        with:
          run: sbt ${{ env.SBT_CHECK_TASKS }} "${{ steps.coursier-cache.outputs.cache-hit-coursier && 'scripted' || 'scriptedSequentialPerModule' }} ${{ env.SBT_SCRIPTED_TARGETS }}"
      - name: Run tests (Windows, retry scripted on Windows fast-fail)
        if: startsWith(matrix.os, 'windows-')
        shell: pwsh
        env:
          E2E_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          & sbt ${{ env.SBT_CHECK_TASKS }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:GITHUB_WORKSPACE/.github/scripts/Invoke-SbtWithRetry.ps1" -Command "scriptedSequentialPerModule $env:SBT_SCRIPTED_TARGETS" -Label scripted
      # Browser-driven hot-reload e2e tests (see the `e2e/*` modules). They spawn
      # a child `sbt ~esbuildServe`, so they need JDK 9+ (process-tree teardown)
      # and run per channel keyed off test-suffix, mirroring scripted. Run as
      # explicit per-module commands (not an aggregate) so they stay sequential.
      - name: Run e2e tests (Linux/macOS)
        if: ${{ matrix.jdk != 8 && !startsWith(matrix.os, 'windows-') }}
        uses: coactions/setup-xvfb@v1
        env:
          E2E_TEST_BROWSER: ${{ matrix.browser }}
          E2E_CHANNEL: ${{ matrix.test-suffix }}
        with:
          run: sbt e2e-web/test e2e-electron/test
      - name: Run e2e tests (Windows, retry on sbt boot race)
        if: ${{ matrix.jdk != 8 && startsWith(matrix.os, 'windows-') }}
        shell: pwsh
        env:
          E2E_TEST_BROWSER: ${{ matrix.browser }}
          E2E_CHANNEL: ${{ matrix.test-suffix }}
        run: |
          & "$env:GITHUB_WORKSPACE/.github/scripts/Invoke-SbtWithRetry.ps1" -Command "e2e-web/test","e2e-electron/test" -Label e2e
